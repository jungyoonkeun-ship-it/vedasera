<!doctype html>
<html lang="en">
<head>

<body>
  <header class="site-header">
    <a href="#top" class="brand" aria-label="VEDA SERA home">
      <img src="assets/logo.png" alt="VEDA SERA">

    <nav>
      <a href="#story">STORY</a>
      <a href="#product">THE MAT</a>
      <a href="#philosophy">PHILOSOPHY</a>

      <a href="#material">MATERIAL</a>
      <a href="https://smartstore.naver.com/vedasera" target="_blank" rel="noopener noreferrer">SHOP</a>

    <!-- Exact approved HERO image -->
    <section class="image-section hero">
      <img src="assets/hero.png" alt="VEDA SERA">
    </section>

    <section class="declaration" id="story">
      <div class="declaration-index">
        <div><span>01</span><b>MOVEMENT</b></div>
        <div><span>02</span><b>REST</b></div>

      <h1>

    <section class="image-section" id="product">
      <img src="assets/product-intro.png" alt="VEDA SERA Handwoven Cotton Yoga Mat">
    </section>

    <section class="image-section" id="philosophy">
      <img src="assets/philosophy.png" alt="VEDA SERA philosophy">
    </section>

    <section class="image-section" id="weave">
      <img src="assets/weave.png" alt="VEDA SERA handwoven process">
    </section>

    <section class="image-section" id="material">
      <img src="assets/material.png" alt="VEDA SERA cotton material">
    </section>

    <!-- Final approved image is one fused image and the whole image is clickable -->
    <section class="image-section final-shop">
      <a
        href="https://smartstore.naver.com/vedasera"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Shop VEDA SERA on Naver Smart Store"
      >
        <img src="assets/shop-final.png" alt="Made to live with — shop VEDA SERA">

    <div class="footer-nav">
      <a href="#story">STORY</a>

      <a href="#material">MATERIAL</a>
      <a href="https://smartstore.naver.com/vedasera" target="_blank" rel="noopener noreferrer">SHOP</a>
